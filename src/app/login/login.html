<div class="row justify-content-center">

  <div class="col-md-6">

    <h2>Login</h2>

    <div class="mb-3">

      <label class="form-label">
        Email
      </label>

      <input
        type="email"
        class="form-control"
        [(ngModel)]="email"
        name="email"
      >

    </div>

    <div class="mb-3">

      <label class="form-label">
        Password
      </label>

      <input
        type="password"
        class="form-control"
        [(ngModel)]="password"
        name="password"
      >

    </div>

    <button
      class="btn btn-primary"
      (click)="login()"
    >
      Login
    </button>

    <p class="text-danger mt-3">
      {{ errorMessage }}
    </p>

  </div>

</div>
